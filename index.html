const haversine = (a, b) => {
  const R = 6371, rad = (d) => (d * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

function useSpring(initial, onUpdate, opts = {}) {
  const cb = useRef(onUpdate);
  cb.current = onUpdate;
  const ctl = useRef(null);
  if (!ctl.current) {
    const D0 = opts.damping ?? 1, R0 = opts.response ?? 0.4, eps = opts.eps ?? 0.01;
    const s = { x: initial, v: 0, t: initial, raf: 0, last: 0, rest: null, d: D0, r: R0 };
    const stop = () => { cancelAnimationFrame(s.raf); s.raf = 0; };
    const tick = (now) => {
      const dt = Math.min((now - s.last) / 1000, 1 / 30);
      s.last = now;
      const w = (2 * Math.PI) / s.r, k = w * w, c = 2 * s.d * w, n = 4, h = dt / n;
      for (let i = 0; i < n; i++) { s.v += (-k * (s.x - s.t) - c * s.v) * h; s.x += s.v * h; }
      if (Math.abs(s.x - s.t) < eps && Math.abs(s.v) < eps * 5) {
        s.x = s.t; s.v = 0; s.raf = 0; cb.current(s.x);
        const r = s.rest; s.rest = null; r && r();
      } else { cb.current(s.x); s.raf = requestAnimationFrame(tick); }
    };
    ctl.current = {
      get: () => s.x,
      stop,
      set: (x) => { stop(); s.x = x; s.t = x; s.v = 0; s.rest = null; cb.current(x); },
      to: (t, o = {}) => {
        if (prefersReduced()) { const r = o.onRest; ctl.current.set(t); r && r(); return; }
        s.t = t;
        if (o.velocity !== undefined) s.v = o.velocity;
        s.d = o.damping ?? D0; s.r = o.response ?? R0; s.rest = o.onRest ?? null;
        if (!s.raf) { s.last = performance.now(); s.raf = requestAnimationFrame(tick); }
      },
    };
  }
  useEffect(() => () => ctl.current.stop(), []);
  return ctl.current;
}

const velocityOf = (hist) => {
  if (hist.length < 2) return 0;
  const last = hist[hist.length - 1], now = last.t;
  const ref = hist.find((h) => now - h.t < 100) ?? hist[0];
  return last.t > ref.t ? ((last.v - ref.v) / (last.t - ref.t)) * 1000 : 0;
};

function useCountUp(target, run, ms = 1100) {
  const [v, setV] = useState(0);
  useEffect(() => {
    if (!run) return setV(0);
    if (prefersReduced()) return setV(target);
    let raf, t0;
    const tick = (t) => {
      t0 ??= t;
      const p = Math.min((t - t0) / ms, 1);
      setV(Math.round(target * (1 - Math.pow(1 - p, 4))));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, run, ms]);
  return v;
}

function WorldMap({ guess, answer, onPick, interactive = true, className = "" }) {
  const ref = useRef(null);
  const [drag, setDrag] = useState(false);
  const pick = (e) => {
    const r = ref.current.getBoundingClientRect();
    onPick({
      lon: clamp(((e.clientX - r.left) / r.width) * 360 - 180, -180, 180),
      lat: clamp(90 - ((e.clientY - r.top) / r.height) * 180, -85, 85),
    });
  };
  const handlers = interactive && onPick ? {
    onPointerDown: (e) => { e.currentTarget.setPointerCapture(e.pointerId); setDrag(true); pick(e); },
    onPointerMove: (e) => drag && pick(e),
    onPointerUp: () => setDrag(false),
    onPointerCancel: () => setDrag(false),
  } : {};
  return (
    <div ref={ref} {...handlers}
      className={`relative aspect-[2/1] w-full touch-none select-none overflow-hidden rounded-2xl bg-[#0b0b0d] ring-1 ring-inset ring-white/10 ${interactive ? "cursor-crosshair" : ""} ${className}`}>

        {guess && answer && (

            stroke="#fff" strokeWidth="1.2" strokeLinecap="round" vectorEffect="non-scaling-stroke" pathLength="1"
            style={{ strokeDasharray: 1, strokeDashoffset: 1, animation: "dag-draw .9s .3s ease forwards" }} />

      {answer && (

function YearSlider({ value, onChange, disabled }) {
  const trackRef = useRef(null), thumbRef = useRef(null), fillRef = useRef(null);
  const frac = (value - MIN_YEAR) / (MAX_YEAR - MIN_YEAR);
  const fracRef = useRef(frac); fracRef.current = frac;
  const drag = useRef(null);

  const paint = () => {
    const th = thumbRef.current, fill = fillRef.current;
    if (!th || !fill) return;
    const o = over.get(), s = press.get();
    th.style.transform = `translate3d(calc(-50% + ${o}px), -50%, 0) scale(${s})`;
    fill.style.width = `calc(${fracRef.current * 100}% + ${Math.max(o, 0)}px)`;
  };
  const over = useSpring(0, paint, { damping: 0.8, response: 0.35, eps: 0.05 });
  const press = useSpring(1, paint, { damping: 1, response: 0.2, eps: 0.0005 });
  useLayoutEffect(paint, [value]);

  const fromX = (clientX) => {
    const d = drag.current, W = d.rect.width;
    const x = clientX - d.rect.left - d.grab;
    const f = x / W;
    over.set(f < 0 ? -rubberband(-x, 56) : f > 1 ? rubberband(x - W, 56) : 0);
    onChange(Math.round(MIN_YEAR + clamp(f, 0, 1) * (MAX_YEAR - MIN_YEAR)));
  };
  const down = (e) => {
    if (disabled) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    const rect = trackRef.current.getBoundingClientRect();
    const center = rect.left + fracRef.current * rect.width;
    const onThumb = Math.abs(e.clientX - center) < 24;
    drag.current = { rect, grab: onThumb ? e.clientX - center : 0 };
    press.to(1.18);
    fromX(e.clientX);
  };
  const move = (e) => drag.current && fromX(e.clientX);
  const up = () => {
    if (!drag.current) return;
    drag.current = null;
    press.to(1);
    over.to(0);
  };
  const key = (e) => {
    if (disabled) return;
    const big = e.shiftKey ? 10 : 1;
    const map = { ArrowLeft: -1 * big, ArrowDown: -1 * big, ArrowRight: big, ArrowUp: big, PageUp: 50, PageDown: -50 };
    let next = null;
    if (e.key in map) next = value + map[e.key];
    else if (e.key === "Home") next = MIN_YEAR;
    else if (e.key === "End") next = MAX_YEAR;
    if (next === null) return;
    e.preventDefault();
    if (next < MIN_YEAR || next > MAX_YEAR) { over.set(next < MIN_YEAR ? -10 : 10); over.to(0); }
    onChange(clamp(next, MIN_YEAR, MAX_YEAR));
  };

  return (
    <div ref={trackRef} role="slider" tabIndex={disabled ? -1 : 0} aria-label="Rok powstania"
      aria-valuemin={MIN_YEAR} aria-valuemax={MAX_YEAR} aria-valuenow={value} aria-valuetext={`${value}, ${era(value)}`}
      onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onKeyDown={key}
      className={`relative h-11 w-full touch-none select-none rounded-full ${disabled ? "opacity-50" : "cursor-pointer"}`}>
      <div className="absolute inset-x-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-white/20" />
      <div ref={fillRef} className="absolute left-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-[#0A84FF]" />
      <div ref={thumbRef} className="absolute top-1/2 h-7 w-7 rounded-full bg-white shadow-[0_2px_10px_rgba(0,0,0,.5),0_0_0_.5px_rgba(0,0,0,.1)]"
        style={{ left: `${frac * 100}%` }} />
    </div>
  );
}

function Lightbox({ art, origin, onClose }) {
  const scrimRef = useRef(null), wrapRef = useRef(null), imgRef = useRef(null);
  const drag = useRef(null);

  const paint = () => {
    const p = open.get(), x = sx.get(), y = sy.get();
    const dist = Math.hypot(x, y), s = 1 - Math.min(dist / 900, 0.3);
    if (wrapRef.current) {
      wrapRef.current.style.transform = `scale(${0.25 + 0.75 * clamp(p, 0, 1.05)})`;
      wrapRef.current.style.opacity = clamp(p * 1.6, 0, 1);
    }
    if (imgRef.current) imgRef.current.style.transform = `translate3d(${x}px,${y}px,0) scale(${s})`;
    if (scrimRef.current) scrimRef.current.style.opacity = clamp(p, 0, 1) * (1 - Math.min(dist / 500, 0.8));
  };
  const open = useSpring(0, paint, { damping: 1, response: 0.42, eps: 0.0005 });
  const sx = useSpring(0, paint, { damping: 1, response: 0.4 });
  const sy = useSpring(0, paint, { damping: 1, response: 0.4 });

  useLayoutEffect(() => { open.set(0); }, []);
  useEffect(() => { open.to(1); }, []);

  const close = (v = { x: 0, y: 0 }) => {
    sx.to(0, { velocity: v.x }); sy.to(0, { velocity: v.y });
    open.to(0, { onRest: onClose });
  };
  useEffect(() => {
    const k = (e) => e.key === "Escape" && close();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  });

  const down = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    sx.stop(); sy.stop();
    drag.current = { x0: e.clientX, y0: e.clientY, bx: sx.get(), by: sy.get(), active: false, hx: [], hy: [] };
  };
  const move = (e) => {
    const d = drag.current; if (!d) return;
    if (!d.active) {
      if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 8) return;
      d.active = true; d.x0 = e.clientX; d.y0 = e.clientY;
    }
    const t = performance.now();
    const x = d.bx + e.clientX - d.x0, y = d.by + e.clientY - d.y0;
    sx.set(x); sy.set(y);
    d.hx = [...d.hx, { t, v: x }].slice(-6); d.hy = [...d.hy, { t, v: y }].slice(-6);
  };
  const up = () => {
    const d = drag.current; if (!d) return; drag.current = null;
    if (!d.active) return close();
    const vx = velocityOf(d.hx), vy = velocityOf(d.hy);
    const px = sx.get() + project(vx), py = sy.get() + project(vy);
    if (Math.hypot(px, py) > 160) close({ x: vx, y: vy });
    else { sx.to(0, { velocity: vx, damping: 0.8, response: 0.3 }); sy.to(0, { velocity: vy, damping: 0.8, response: 0.3 }); }
  };

  return (
    <div className="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label="Podgląd obrazu">
      <div ref={scrimRef} onClick={() => close()} className="absolute inset-0 bg-black/95" style={{ opacity: 0 }} />
      <div ref={wrapRef} className="pointer-events-none absolute inset-0 grid place-items-center p-4"
        style={{ transformOrigin: `${origin.x}px ${origin.y}px`, opacity: 0, transform: "scale(.25)" }}>
        <img ref={imgRef} src={art.img} alt="Dzieło sztuki do odgadnięcia" draggable={false}
          onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
          className="pointer-events-auto max-h-[92vh] max-w-[96vw] touch-none select-none rounded-2xl object-contain shadow-2xl will-change-transform" />
      </div>
      <button onClick={() => close()} aria-label="Zamknij"
        className="press glass glass-chip absolute right-5 top-5 grid h-11 w-11 place-items-center rounded-full text-white hover:bg-white/20">
        <X size={20} />
      </button>
    </div>
  );
}

function YearTrack({ guess, answer }) {
  const p = (y) => ((y - MIN_YEAR) / (MAX_YEAR - MIN_YEAR)) * 100;

function ResultModal({ art, guess, puzzleNo, onClose, onNext, onProgress }) {
  const sheetRef = useRef(null), scrimRef = useRef(null), dragRef = useRef(null);
  const [run, setRun] = useState(false);
  const [copied, setCopied] = useState(false);

  const offscreen = () => (sheetRef.current?.offsetHeight ?? 700) + 48;
  const paint = (y) => {
    if (sheetRef.current) sheetRef.current.style.transform = `translate3d(0,${y}px,0)`;
    const p = 1 - clamp(y / offscreen(), 0, 1);
    if (scrimRef.current) scrimRef.current.style.opacity = p;
    onProgress?.(p);
  };
  const sheet = useSpring(1000, paint, { damping: 1, response: 0.42 });

  useLayoutEffect(() => { sheet.set(offscreen()); }, []);
  useEffect(() => {
    sheet.to(0);
    const t = setTimeout(() => setRun(true), 250);
    navigator.vibrate?.(12);
    return () => { clearTimeout(t); sheet.stop(); onProgress?.(0); };
  }, []);

  const dismiss = (velocity, callback) => {
    sheet.to(offscreen(), { velocity, response: 0.3, onRest: callback || onClose });
  };

  useEffect(() => {
    const k = (e) => e.key === "Escape" && dismiss(0);
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  });

  const down = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    sheet.stop();
    dragRef.current = { y0: e.clientY, s0: sheet.get(), active: false, hist: [] };
  };
  const move = (e) => {
    const d = dragRef.current; if (!d) return;
    if (!d.active) {
      if (Math.abs(e.clientY - d.y0) < 6) return;
      d.active = true; d.x0 = e.clientY; d.y0 = e.clientY;
    }
    const raw = d.s0 + (e.clientY - d.y0);
    const y = raw < 0 ? -rubberband(-raw, 120) : raw;
    sheet.set(y);
    d.hist = [...d.hist, { t: performance.now(), v: y }].slice(-6);
  };
  const up = () => {
    const d = dragRef.current; if (!d) return; dragRef.current = null;
    if (!d.active) return sheet.to(0);
    const v = velocityOf(d.hist);
    const projected = sheet.get() + project(v);
    if (projected > sheetRef.current.offsetHeight * 0.4) dismiss(v);
    else sheet.to(0, { velocity: v, damping: 0.8, response: 0.3 });
  };

  const diff = Math.abs(guess.year - art.year);
  const km = Math.round(haversine(guess, art));
  const ys = yearScore(diff), ps = placeScore(km), total = ys + ps;
  const shown = useCountUp(total, run);

  const text = [
    `flyq.lab — Art Guesser #${puzzleNo}`,
    `🎨 ${fmt(total)} / 5 000`,
    `📅 ${blocks(ys)}  ±${diff} ${diff === 1 ? "rok" : "lat"}`,
    `📍 ${blocks(ps)}  ${fmt(km)} km`,
  ].join("\n");

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    navigator.vibrate?.(10);
    setCopied(true); setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div className="fixed inset-0 z-40 flex items-end justify-center" role="dialog" aria-modal="true" aria-label="Wynik">
      <div ref={scrimRef} onClick={() => dismiss(0)} className="absolute inset-0 bg-black/60" style={{ opacity: 0 }} />
      <div ref={sheetRef}
        className="glass glass-thick relative flex max-h-[92dvh] w-full max-w-lg flex-col rounded-t-[32px] shadow-[0_-20px_80px_rgba(0,0,0,.7)] will-change-transform sm:mb-6 sm:rounded-[32px]">
        <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
          className="flex h-9 shrink-0 cursor-grab touch-none items-center justify-center active:cursor-grabbing" aria-label="Przeciągnij w dół, aby zamknąć">
          <div className="h-1.5 w-10 rounded-full bg-white/30" />
        </div>
        <button onClick={() => dismiss(0)} aria-label="Zamknij"
          className="press absolute right-4 top-3 grid h-9 w-9 place-items-center rounded-full bg-white/10 text-white/80 hover:bg-white/20 hover:text-white">
          <X size={16} />
        </button>

        <div className="overflow-y-auto overscroll-contain px-6 pb-6 pt-1 sm:px-8 sm:pb-8 [mask-image:linear-gradient(to_bottom,transparent,black_14px)]">
          <div className="pt-3 text-center">
            <p className="t-label text-white/70">{verdict(total)}</p>
            <p className="t-score num mt-1 text-white">{fmt(shown)}</p>
            <p className="t-label mt-2 text-white/60">z 5 000 punktów</p>
            <div className="mt-5"><ScoreBar value={total} max={5000} run={run} color="linear-gradient(90deg,#0A84FF,#64D2FF)" /></div>
          </div>

          <section className="mt-7 rounded-2xl bg-[#2c2c2e] p-4 ring-1 ring-inset ring-white/10">
            <div className="flex items-baseline justify-between">
              <h3 className="t-headline text-white">Rok</h3>
              <span className="t-body num text-white/70">{fmt(ys)} / 2 500</span>
            </div>
            <p className="t-metric num mt-1 text-white">
              {diff === 0 ? "Trafiony" : <>±{fmt(diff)} <span className="t-headline font-medium text-white/65">{diff === 1 ? "rok" : "lat różnicy"}</span></>}
            </p>
            <YearTrack guess={guess.year} answer={art.year} />
            <div className="t-label num flex justify-between">
              <span className="text-[#64B5FF]">Twój typ {guess.year}</span>
              <span className="text-[#30D158]">Prawda {art.year}</span>
            </div>
            <div className="mt-3"><ScoreBar value={ys} max={2500} run={run} color="#0A84FF" /></div>
          </section>

          <section className="mt-3 rounded-2xl bg-[#2c2c2e] p-4 ring-1 ring-inset ring-white/10">
            <div className="flex items-baseline justify-between">
              <h3 className="t-headline text-white">Miejsce</h3>
              <span className="t-body num text-white/70">{fmt(ps)} / 2 500</span>
            </div>
            <p className="t-metric num mt-1 text-white">{fmt(km)} <span className="t-headline font-medium text-white/65">km od celu</span></p>
            <div className="mt-3"><WorldMap guess={guess} answer={art} interactive={false} /></div>
            <div className="mt-3"><ScoreBar value={ps} max={2500} run={run} color="#30D158" /></div>
          </section>

          <div className="mt-5 text-center">
            <p className="t-headline text-white">{art.title}</p>
            <p className="t-body text-white/70">{art.artist}, {art.year}, {art.place}</p>
          </div>

          <pre className="t-body num mt-5 whitespace-pre-wrap rounded-2xl bg-black/40 p-4 text-center font-[inherit] leading-relaxed text-white/85 ring-1 ring-inset ring-white/10">{text}</pre>
          
          <div className="mt-4 flex flex-col gap-2.5">
            <button onClick={() => dismiss(0, onNext)}
              className="press t-headline flex h-14 w-full items-center justify-center gap-2 rounded-2xl bg-[#0A84FF] text-white shadow-[0_8px_24px_rgba(10,132,255,.35)] hover:bg-[#2b95ff]">
              Następna zagadka <ArrowRight size={20} />
            </button>
            <button onClick={copy}
              className={`press t-headline flex h-12 w-full items-center justify-center gap-2 rounded-2xl ${copied ? "bg-[#30D158] text-black" : "bg-white/10 text-white/90 hover:bg-white/15"}`}>
              {copied ? <><Check size={18} /> Skopiowano</> : <><Copy size={18} /> Kopiuj wynik</>}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

                {/* AKCJA */}
                <button onClick={submit} disabled={done}
                  className={`press t-headline h-14 w-full shrink-0 rounded-2xl px-7 sm:w-auto ${ready ? "bg-[#0A84FF] text-white shadow-[0_8px_24px_rgba(10,132,255,.4)] hover:bg-[#2b95ff]" : "bg-white/15 text-white/80 hover:bg-white/20"} disabled:opacity-40`}>
                  {done ? "Zatwierdzono" : ready ? "Potwierdź typ" : "Postaw pinezkę"}
                </button>
              </div>
            </div>
          </div>
        )}
      </div>

      {lb && <Lightbox art={art} origin={lb} onClose={() => setLb(null)} />}
      {showResult && done && pin && (
        <ResultModal art={art} guess={{ year, lat: pin.lat, lon: pin.lon }} puzzleNo={puzzleCount}
          onProgress={recede} onClose={() => { setShowResult(false); nextPuzzle(); }} onNext={nextPuzzle} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DailyArtGuesser />);
</script>
</body>
</html>
